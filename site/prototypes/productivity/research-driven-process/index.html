<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>body{margin:0;background:#fff}a{color:#1b61c9;text-decoration:none}a:hover{color:#1a3866}</style>
</helmet>
<div style="min-height:100vh;display:flex;font-family:Inter,-apple-system,'Segoe UI',sans-serif;background:#fff;color:#333840">
  <nav style="width:88px;flex:0 0 88px;box-sizing:border-box;background:#2b2f36;position:sticky;top:0;height:100vh;padding:16px 8px;display:flex;flex-direction:column;gap:16px;z-index:60">
    <div onClick="{{ toHome }}" style="{{ rpStyle }}" style-hover="{{ rpHover }}"><svg width="20" height="20" viewBox="0 0 28 28" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5H21a3.5 3.5 0 0 1 3.5 3.5v12A3.5 3.5 0 0 1 21 24H7a3.5 3.5 0 0 1-3.5-3.5V16"></path><circle cx="6" cy="6" r="4"></circle></svg>Research Projects</div>
    <div onClick="{{ toInsights }}" style="{{ piStyle }}" style-hover="{{ piHover }}"><svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><path d="M3 16V9M8 16V4M13 16v-5M18 16V7" transform="translate(-1 0)"></path></svg>Platform Insights</div>
  </nav>
  <div style="flex:1;min-width:0;display:flex;flex-direction:column">
  <sc-if value="{{ inProject }}" hint-placeholder-val="{{ false }}">
    <div style="height:56px;flex:0 0 56px;box-sizing:border-box;border-bottom:1px solid #ddd;display:flex;align-items:center;gap:16px;padding:0 32px;background:#fff;position:sticky;top:0;z-index:50">
      <div onClick="{{ toHome }}" style="cursor:pointer;color:#1b61c9;font-size:15px" style-hover="color:#1a3866">← Research Projects</div>
      <div style="width:1px;height:20px;background:#ddd"></div>
      <div style="font-size:17px;font-weight:600;color:#181d26;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">{{ projectName }}</div>
    </div>
  </sc-if>
  <div style="display:flex;flex:1;min-height:0">
    <sc-if value="{{ inProject }}" hint-placeholder-val="{{ false }}">
      <div style="width:216px;flex:0 0 216px;box-sizing:border-box;border-right:1px solid #ddd;background:#f8fafc;padding:24px 16px;position:sticky;top:56px;height:calc(100vh - 56px);overflow:auto;display:flex;flex-direction:column;gap:40px">
        <sc-for list="{{ groups }}" as="g" hint-placeholder-count="3">
          <div style="display:flex;flex-direction:column;gap:4px">
            <div style="font-size:12px;font-weight:500;letter-spacing:.16px;color:#41454d;text-transform:uppercase;padding:0 12px 6px">{{ g.label }}</div>
            <sc-for list="{{ g.items }}" as="it" hint-placeholder-count="3">
              <div>
                <sc-if value="{{ it.enabled }}" hint-placeholder-val="{{ true }}">
                  <div onClick="{{ it.go }}" style="{{ it.row }}" style-hover="{{ it.hover }}"><div style="{{ it.dot }}">{{ it.num }}</div><div style="flex:1;min-width:0">{{ it.label }}</div></div>
                </sc-if>
                <sc-if value="{{ it.disabled }}" hint-placeholder-val="{{ false }}">
                  <div title="{{ it.hint }}" style="{{ it.row }}"><div style="{{ it.dot }}">{{ it.num }}</div><div style="flex:1;min-width:0">{{ it.label }}</div><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="#9297a0" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" style="flex:0 0 auto"><rect x="3" y="7" width="10" height="7" rx="1.5"></rect><path d="M5.5 7V5a2.5 2.5 0 0 1 5 0v2"></path></svg></div>
                </sc-if>
              </div>
            </sc-for>
          </div>
        </sc-for>
      </div>
    </sc-if>
    <div style="flex:1;min-width:0">
      <iframe src="Research.dc.html" title="Themes" data-m="r" onLoad="{{ onFrameLoad }}" style="{{ showR }}"></iframe>
      <iframe src="Spec%20Writer.dc.html" title="Docs" data-m="s" onLoad="{{ onFrameLoad }}" style="{{ showS }}"></iframe>
      <iframe src="Platform%20Insights.dc.html" title="Platform Insights" onLoad="{{ onFrameLoad }}" style="{{ showI }}"></iframe>
      <iframe src="Boards.dc.html" title="Boards" data-m="b" onLoad="{{ onFrameLoad }}" style="{{ showB }}"></iframe>
    </div>
  </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  state = { view: 'home', pid: null, section: 'plan' };
  RS = ['plan', 'tasks', 'transcripts', 'themes', 'prio', 'journey'];
  read(k, d) { try { const v = JSON.parse(localStorage.getItem(k) || 'null'); return v == null ? d : v; } catch (e) { return d; } }
  projects() { const d = this.read('signalflow-projects-v1', null); return d && Array.isArray(d.projects) ? d.projects : []; }
  published() { const l = this.read('signalflow-published-specs-v1', []); return Array.isArray(l) ? l : []; }
  frame(m) { const f = document.querySelector('iframe[data-m="' + m + '"]'); return f && f.contentWindow; }
  post(m, msg) { const w = this.frame(m); if (w) try { w.postMessage(Object.assign({ sf: 'nav' }, msg), '*'); } catch (e) {} }
  send() {
    const s = this.state;
    if (s.view === 'insights') return;
    if (s.view === 'home') return this.post('r', { view: 'home' });
    if (this.RS.includes(s.section)) return this.post('r', s.pid ? { view: 'project', pid: s.pid, section: s.section } : { view: 'new' });
    if (s.section === 'docs') return this.post('s', { section: 'docs', pid: s.pid });
    if (s.section === 'boards') return this.post('b', { section: 'boards', pid: s.pid });
  }
  go(view, pid, section) { this.setState({ view, pid, section }, () => this.send()); window.scrollTo(0, 0); }
  avail() {
    const s = this.state, P = this.projects().find(p => p.id === s.pid), an = !!P && (P.themes || []).length > 0;
    const pub = !!s.pid && this.published().some(x => (x.pid || String(x.key).split(':')[0]) === s.pid);
    return { P, plan: true, tasks: !!P, transcripts: !!P, themes: an, prio: an, journey: an, docs: an, boards: pub };
  }
  componentDidMount() {
    this._msg = e => {
      const m = e.data; if (!m || !m.sf) return;
      if (m.sf === 'new') this.go('project', null, 'plan');
      else if (m.sf === 'open') this.go('project', m.pid, m.analyzed ? 'themes' : 'plan');
      else if (m.sf === 'home') this.go('home', null, 'plan');
      else if (m.sf === 'tab') { if (this.state.view === 'project' && this.RS.includes(this.state.section) && this.RS.includes(m.tab)) this.setState({ pid: m.pid || this.state.pid, section: m.tab }); }
      else if (m.sf === 'planSaved') this.go('project', m.pid, 'tasks');
      else if (m.sf === 'published') this.go('project', this.state.pid, 'boards');
    };
    this._st = () => this.forceUpdate();
    window.addEventListener('message', this._msg); window.addEventListener('storage', this._st);
  }
  componentWillUnmount() { window.removeEventListener('message', this._msg); window.removeEventListener('storage', this._st); }
  renderVals() {
    const s = this.state, A = this.avail(), inP = s.view === 'project';
    const defs = [
      ['Plan', [['plan', 'Test Plan', ''], ['tasks', 'Task List', 'Save the test plan first'], ['transcripts', 'Transcripts', 'Save the test plan first']]],
      ['Analyze', [['themes', 'Themes', 'Save and analyze a transcript first'], ['journey', 'Journey Map', 'Save and analyze a transcript first'], ['prio', 'Priorities', 'Save and analyze a transcript first']]],
      ['Deliver', [['docs', 'Requirements', 'Save and analyze a transcript first'], ['boards', 'Stories', 'Publish the doc first']]]
    ];
    let n = 0;
    const groups = defs.map(([label, its]) => ({ label, items: its.map(([k, name, hint]) => {
      n++; const on = s.section === k, ok = !!A[k];
      return { label: name, num: n, hint, enabled: ok, disabled: !ok,
        go: () => { if (A[k] && s.section !== k) this.go('project', s.pid, k); },
        row: 'display:flex;align-items:center;gap:12px;padding:9px 12px;border-radius:8px;font-size:15px;box-sizing:border-box;' + (on ? 'background:#181d26;color:#ffffff;font-weight:500;cursor:default' : ok ? 'color:#181d26;cursor:pointer' : 'color:#9297a0;cursor:not-allowed'),
        hover: on ? 'background:#181d26' : 'background:#e8eaed',
        dot: 'width:24px;height:24px;border-radius:50%;box-sizing:border-box;display:grid;place-items:center;font-size:12px;font-weight:500;flex:0 0 auto;' + (on ? 'background:#ffffff;color:#181d26' : ok ? 'color:#181d26;background:transparent' : 'color:#9297a0;background:transparent')
      };
    }) }));
    const fs = k => 'border:0;width:100%;display:' + (k ? 'block' : 'none') + ';height:' + (inP ? 'calc(100vh - 56px)' : '100vh');
    const ins = s.view === 'insights';
    const research = !ins && (!inP || this.RS.includes(s.section));
    const nav = (on) => 'display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;border-radius:8px;font-size:12px;line-height:1.25;text-align:center;cursor:pointer;' + (on ? 'font-weight:500;background:#4a4f58;color:#ffffff' : 'color:#c9ccd2');
    const hov = (on) => on ? 'background:#4a4f58;color:#ffffff' : 'background:#3a3e46;color:#ffffff';
    return {
      inProject: inP, groups, projectName: A.P ? A.P.name : 'New project',
      toHome: () => this.go('home', null, 'plan'),
      toInsights: () => this.go('insights', null, 'plan'),
      rpStyle: nav(!ins), rpHover: hov(!ins), piStyle: nav(ins), piHover: hov(ins),
      showI: fs(ins),
      onFrameLoad: () => this.send(),
      showR: fs(research), showS: fs(inP && s.section === 'docs'), showB: fs(inP && s.section === 'boards')
    };
  }
}
</script>
</body>
</html>
