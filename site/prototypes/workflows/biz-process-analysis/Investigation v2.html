<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="ext-resource-dependency" content="assets/skan-logo.png" data-resource-id="skanLogo" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Skan.ai · Participant Investigations</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link href="css/styles.css" rel="stylesheet" />
<style>
.appbar-logo,.appbar-divider{visibility:hidden}
.ins-step{border:1px solid var(--hairline);border-radius:12px;padding:12px 12px 12px;margin:0 0 10px;background:var(--canvas);transition:border-color .2s,box-shadow .2s}
.ins-step.on{border-color:var(--skan-blue);box-shadow:0 0 0 3px rgba(64,97,231,.12)}
.ins-head{display:flex;align-items:center;gap:6px}
.ins-title{flex:1;display:flex;align-items:center;gap:10px;background:none;border:none;padding:0;text-align:left}
.ins-num{flex:0 0 24px;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;background:var(--surface-soft2);color:var(--muted)}
.ins-step.on .ins-num{background:var(--skan-blue);color:#fff}
.ins-step.done .ins-num{background:#e6f4ee;color:#2e8a6f}
.ins-name{font-size:14px;font-weight:600;color:var(--ink)}
.ins-step.on .ins-name{color:var(--skan-blue)}
.ins-title:hover .ins-name{color:var(--skan-blue)}
.ins-chev{background:none;border:none;color:var(--faint);display:flex;padding:4px;border-radius:6px}
.ins-chev:hover{background:var(--surface-soft);color:var(--ink)}
.ins-meta{display:flex;align-items:center;gap:12px;margin:6px 0 0 34px;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.ins-meta span{display:inline-flex;align-items:center;gap:4px}
.ins-dev{color:var(--coral-strong);font-weight:600}
.ins-body{margin:10px 0 0 34px;display:flex;flex-direction:column;gap:10px}
.ins-summary{margin:0;font-size:13px;line-height:1.5;color:var(--body);text-wrap:pretty}
.ins-recs{display:flex;flex-direction:column;gap:6px}
.ins-rec{display:grid;grid-template-columns:1fr auto;gap:4px 8px;text-align:left;background:var(--surface-soft);border:1px solid var(--hairline);border-radius:9px;padding:9px 10px;transition:border-color .15s,background .15s}
.ins-rec:hover{border-color:var(--skan-blue);background:var(--skan-blue-soft)}
.ins-kind{grid-column:1;justify-self:start;font-size:10.5px;font-weight:700;letter-spacing:.03em;padding:2px 8px;border-radius:999px}
.k-automation{color:var(--skan-blue);background:var(--skan-blue-soft)}
.k-improvement{color:#8a5a12;background:#fbf3e2}
.k-compliance{color:var(--coral-strong);background:var(--coral-bg)}
.ins-rec-jump{grid-column:2;grid-row:1;display:flex;align-items:center;gap:3px;font-size:11px;font-weight:600;color:var(--skan-blue);font-variant-numeric:tabular-nums}
.ins-rec-text{grid-column:1/-1;font-size:12.5px;line-height:1.45;color:var(--ink);text-wrap:pretty}
.ins-none{margin:0;font-size:12px;color:var(--muted)}
.tl-scroll{padding:12px 12px 30px}
.tp-right{gap:8px}
.sap,.sap *{white-space:nowrap}
.sap-toolbar{flex-wrap:nowrap;overflow:hidden}
.sap-body{overflow:hidden}
.sap-vendor-card{white-space:normal}
.sap-thead span,.sap-trow span{overflow:hidden;text-overflow:ellipsis}
.sap-thead,.sap-trow{grid-template-columns:22px .9fr 1.4fr .6fr .6fr 1fr .6fr 1fr}
.assist-head{justify-content:space-between}
.appbar-search{display:flex;align-items:center;gap:8px;width:min(360px,40vw);height:34px;padding:0 12px;border:1px solid var(--hairline-strong);border-radius:6px;background:var(--surface-soft);color:var(--muted);transition:border-color .15s,background .15s}
.appbar-search:focus-within{border-color:var(--skan-blue);background:#fff}
.appbar-search input{flex:1;min-width:0;border:none;outline:none;background:none;font:inherit;font-size:13px;color:var(--ink)}
.assist-suggestions{gap:6px;padding:10px 14px}
.suggest{padding:7px 12px;font-size:12px;border-radius:6px}
.run-e2e{padding:8px;font-size:12.5px;border-radius:6px;gap:6px}
.run-e2e svg{width:14px;height:14px}
.assist-input{gap:6px;padding:10px 14px 14px}
.assist-input input{height:34px;font-size:12.5px;padding:0 14px}
.assist-send,.assist-voice{flex:0 0 32px;width:32px;height:32px}
.assist-send svg,.assist-voice svg{width:15px;height:15px}
.tp-left{gap:4px}
.tp-btn{width:30px;height:30px;border-radius:6px}
.tp-btn svg{width:15px;height:15px}
.tp-play{width:34px;height:34px;box-shadow:0 2px 8px rgba(64,97,231,.25)}
.tp-play svg{width:16px;height:16px}
.tp-toggle{gap:6px;padding:6px 10px;font-size:12px;border-radius:6px}
.tp-toggle{color:var(--body)}
.tp-toggle:hover{border-color:var(--skan-blue);color:var(--skan-blue)}
.tp-toggle.on,.tp-toggle.on:not(.primary){background:var(--skan-blue);border-color:var(--skan-blue);color:#fff}
.tp-toggle.on:hover{background:var(--skan-blue-dark);border-color:var(--skan-blue-dark);color:#fff}
</style>
<style>
  :root {
    /* Skan brand */
    --skan-indigo: #2e1a6e;
    --skan-blue: #4061e7;
    --skan-blue-dark: #3450c5;
    --skan-blue-soft: #eef1fe;
    --start-cyan: #aadff1;
    --start-cyan-ring: #6fc6e6;
    /* deviation */
    --coral: #e37373;
    --coral-strong: #d94f4f;
    --coral-bg: #fdeeee;
    /* neutrals (Airtable-aligned) */
    --ink: #181d26;
    --body: #333840;
    --muted: #6b7280;
    --faint: #9aa0aa;
    --hairline: #e5e7eb;
    --hairline-strong: #d4d7dd;
    --canvas: #ffffff;
    --surface-soft: #f7f8fa;
    --surface-soft2: #eef0f3;
    --sap-navy: #354a5f;
    --sap-blue: #0a6ed1;
    --green-ribbon: #cdd8b3;
    --radius-sm: 6px;
    --radius-md: 10px;
    --radius-lg: 14px;
    --shadow-card: 0 1px 2px rgba(24,29,38,.04), 0 8px 24px rgba(24,29,38,.06);
    --shadow-pop: 0 12px 40px rgba(24,29,38,.16);
    --header-h: 64px;
    --nav-w: 80px;
    --assist-w: 348px;
    --timeline-w: 376px;
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    color: var(--body);
    background: var(--surface-soft2);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
    overflow: hidden;
  }
  #root { height: 100vh; overflow: auto; }
  button { font-family: inherit; cursor: pointer; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: #d6d9df; border-radius: 8px; border: 3px solid transparent; background-clip: content-box; }
  ::-webkit-scrollbar-thumb:hover { background: #c2c6cf; background-clip: content-box; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
</head>
<body>
  <div id="root"></div>

  <template id="__bundler_thumbnail">
    <svg viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
      <rect width="400" height="400" fill="#4061e7"/>
      <circle cx="200" cy="150" r="34" fill="#aadff1"/>
      <rect x="150" y="232" width="100" height="40" rx="8" fill="#fff"/>
      <rect x="150" y="288" width="100" height="40" rx="8" fill="#fff" opacity="0.55"/>
      <path d="M200 184 V232 M168 308 h-40 a8 8 0 0 0-8 8 v0" stroke="#fff" stroke-width="3" fill="none" stroke-linecap="round"/>
      <text x="200" y="150" font-family="Inter,sans-serif" font-size="13" font-weight="700" fill="#0f3a4d" text-anchor="middle" dominant-baseline="central">Start</text>
    </svg>
  </template>

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <script type="text/babel" src="js/data.jsx"></script>
  <script type="text/babel" src="js/icons.jsx"></script>
  <script type="text/babel" src="js/ScreenTemplates.jsx"></script>
  <script type="text/babel" src="js/Flow.jsx"></script>
  <script type="text/babel" src="js/Assistant.jsx"></script>
  <script type="text/babel" src="js/Timeline.jsx"></script>
  <script type="text/babel" src="js/Insights.jsx"></script>
  <script type="text/babel" src="js/Controls.jsx"></script>
  <script type="text/babel" src="js/Dashboard.jsx"></script>
  <script type="text/babel" src="js/App.jsx"></script>
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
